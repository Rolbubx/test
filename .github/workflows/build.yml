name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "claude/wizardly-galileo-euxdgo" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish game
        run: dotnet publish GT67/GT67.csproj -c Game -r ${{ matrix.rid }} -p:GameAot=false -o out/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: GT67-${{ matrix.rid }}
          path: out/${{ matrix.rid }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in linux-x64 win-x64; do
            (cd artifacts/GT67-$r && zip -qr ../../GT67-$r.zip .)
          done
          gh release create "build-${{ github.run_number }}" GT67-linux-x64.zip GT67-win-x64.zip \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "GT67 build ${{ github.run_number }}" --notes "Game build (linux-x64, win-x64)"
