name: Release

# Push a tag such as v1.0.0 to build the editor and the game for Windows and Linux and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The editor: needs the .NET 8 runtime (or SDK) on the machine.
      - name: Publish the editor
        run: dotnet publish SolciteEngine/SolciteEngine.csproj -c Editor -r ${{ matrix.rid }} --self-contained false -o out/editor

      - name: Check that the editor ships no game
        shell: bash
        run: |
          if [ -e out/editor/Assets/Game ] || grep -aq GameGenerator out/editor/SolciteEngine.dll; then
            echo "::error::The editor package contains a game. No game may ship inside the editor."
            exit 1
          fi

      # The game: a trimmed ReadyToRun build that runs without .NET installed (no C++ tools needed, unlike Native AOT).
      - name: Publish the game
        run: dotnet publish SolciteEngine/SolciteEngine.csproj -c Game -r ${{ matrix.rid }} -p:GameAot=false -o out/game

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd out
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            7z a ../dist/SolciteEngine-Editor-${{ matrix.rid }}.zip ./editor/*
            7z a ../dist/SolciteEngine-Game-${{ matrix.rid }}.zip ./game/*
          else
            (cd editor && zip -qr ../../dist/SolciteEngine-Editor-${{ matrix.rid }}.zip .)
            (cd game && zip -qr ../../dist/SolciteEngine-Game-${{ matrix.rid }}.zip .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SolciteEngine-${{ matrix.rid }}
          path: dist/*.zip

  release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
