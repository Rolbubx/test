name: CI/CD

# Every push and pull request: build the engine and run the tests.
# A push to main (or a v* tag) also publishes the Windows/Linux builds as a GitHub release, but only if the
# test gate passes: at least 97% of all tests pass AND every critical test passes
# ([Trait("Category", "Critical")], see tests/SolciteEngine.Tests/Critical.cs and .github/scripts/test_gate.py).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_PASS_RATE: 97
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Editor, Game]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SolciteEngine/SolciteEngine.csproj

      - name: Build
        run: dotnet build SolciteEngine/SolciteEngine.csproj -c ${{ matrix.configuration }} --no-restore -warnaserror:CS8602,CS8604

      - name: The editor ships no game
        if: matrix.configuration == 'Editor'
        shell: bash
        run: |
          out=SolciteEngine/bin/Editor/net8.0
          if [ -e "$out/Assets/Game" ] || grep -aq GameGenerator "$out/SolciteEngine.dll"; then
            echo "::error::The Editor build contains a game (Assets/Game or GameGenerator). No game may ship inside the editor."
            exit 1
          fi

  generated-game:
    name: Generated game builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Generated/GeneratedGame
        run: dotnet build SolciteEngine/Generated/GeneratedGame/GeneratedGame.csproj

  test:
    name: Tests + release gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Failures do not stop the job here: the gate below reads the reports and decides.
      - name: All tests
        id: all
        continue-on-error: true
        run: dotnet test tests/SolciteEngine.Tests --logger "trx;LogFileName=all.trx" --results-directory test-results

      - name: Critical tests
        continue-on-error: true
        run: dotnet test tests/SolciteEngine.Tests --no-build --filter "Category=Critical" --logger "trx;LogFileName=critical.trx" --results-directory test-results

      - name: Release gate (>= ${{ env.MIN_PASS_RATE }}% and no critical failure)
        id: gate
        continue-on-error: true
        run: python3 .github/scripts/test_gate.py test-results/all.trx test-results/critical.trx --min-rate $MIN_PASS_RATE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/*.trx

      # The job (and the commit's check) still turns red when any test fails, even if the gate lets the release through.
      - name: Fail if a test failed
        if: steps.all.outcome != 'success'
        run: |
          echo "::error::Some tests failed (see the Test gate summary)."
          exit 1

  publish:
    name: Publish (${{ matrix.rid }})
    needs: [build, test]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.test.outputs.publish == 'true' &&
      github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # A v1.2.3 tag gives 1.2.3; a push to main gives <csproj Version>.<run number> (e.g. 0.1.0.42), so the
      # updater (Utils/Updater.cs) always sees a newer version than the one installed.
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            base=$(grep -oPm1 '(?<=<Version>)[^<]+' SolciteEngine/SolciteEngine.csproj)
            v="$base.${{ github.run_number }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      # The editor: needs the .NET 8 runtime (or SDK) on the machine.
      - name: Publish the editor
        run: dotnet publish SolciteEngine/SolciteEngine.csproj -c Editor -r ${{ matrix.rid }} --self-contained false -p:Version=${{ steps.version.outputs.version }} -o out/editor

      - name: Check that the editor ships no game
        shell: bash
        run: |
          if [ -e out/editor/Assets/Game ] || grep -aq GameGenerator out/editor/SolciteEngine.dll; then
            echo "::error::The editor package contains a game. No game may ship inside the editor."
            exit 1
          fi

      # The game: a trimmed ReadyToRun build that runs without .NET installed (no C++ tools needed, unlike Native AOT).
      - name: Publish the game
        run: dotnet publish SolciteEngine/SolciteEngine.csproj -c Game -r ${{ matrix.rid }} -p:GameAot=false -p:Version=${{ steps.version.outputs.version }} -o out/game

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd out
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            7z a ../dist/SolciteEngine-Editor-${{ matrix.rid }}.zip ./editor/*
            7z a ../dist/SolciteEngine-Game-${{ matrix.rid }}.zip ./game/*
          else
            (cd editor && zip -qr ../../dist/SolciteEngine-Editor-${{ matrix.rid }}.zip .)
            (cd game && zip -qr ../../dist/SolciteEngine-Game-${{ matrix.rid }}.zip .)
          fi

      # The stand-alone installer (.exe on Windows): downloads the editor from this release.
      - name: Publish the downloader
        run: dotnet publish SolciteEngineDownloader/SolciteEngineDownloader.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ steps.version.outputs.version }} -o out/downloader

      - name: Package the downloader
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            cp out/downloader/SolciteEngineDownloader.exe dist/SolciteEngineDownloader.exe
          else
            cp out/downloader/SolciteEngineDownloader dist/SolciteEngineDownloader-${{ matrix.rid }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SolciteEngine-${{ matrix.rid }}
          path: dist/*

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    name: GitHub release
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
